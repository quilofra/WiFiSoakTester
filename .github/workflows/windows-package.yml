name: Windows Package

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-package.yml
      - windows/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/windows-package.yml
      - windows/**
  workflow_dispatch:

jobs:
  package-windows:
    name: Build and package Windows CLI
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh
        working-directory: windows/WiFiSoakTester

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Visual Studio environment
        uses: compnerd/gha-setup-vsdevenv@main
        with:
          arch: x64

      - name: Setup Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE

      - name: Show toolchain
        run: swift --version

      - name: Resolve package
        run: swift package resolve

      - name: Build Windows bundle
        run: powershell -ExecutionPolicy Bypass -File build_windows.ps1

      - name: Smoke test bundled binary
        run: |
          $bundle = (Resolve-Path .\BuildWindows\wifisoaktester-windows-x64).Path
          $requiredRuntimeFiles = @(
            "Foundation.dll",
            "FoundationEssentials.dll",
            "FoundationNetworking.dll",
            "swiftCRT.dll",
            "swiftCore.dll",
            "swiftDispatch.dll",
            "swiftWinSDK.dll",
            "swift_Concurrency.dll",
            "VCRUNTIME140.dll"
          )

          $missing = $requiredRuntimeFiles |
            Where-Object { -not (Test-Path -LiteralPath (Join-Path $bundle $_)) }

          if ($missing) {
            throw "Bundle is missing runtime files: $($missing -join ', ')"
          }

          $originalPath = $env:PATH
          try {
            $env:PATH = "$bundle;$env:SystemRoot\System32;$env:SystemRoot"
            & (Join-Path $bundle "WiFiSoakTester.exe") --help
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          finally {
            $env:PATH = $originalPath
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifisoaktester-windows-x64
          path: windows/WiFiSoakTester/BuildWindows/wifisoaktester-windows-x64.zip
          if-no-files-found: error
